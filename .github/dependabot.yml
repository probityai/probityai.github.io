version: 2

# One weekly pull request moves every action pin together. github/codeql-action's init,
# analyze and upload-sarif must stay at one version: analyze refuses a database another
# version wrote. Dependencies under atlas/ are pinned inside retained experiments and
# examples, whose recorded runs replay only at those versions, so they are not bumped here.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
