        uv venv --python 3.12 "$RUNNER_TEMP/impl-env"
        deps=$(python3 tools/run_board.py --id "${{ matrix.id }}" --src "$RUNNER_TEMP/impl" --print-deps)
        if [ -n "$deps" ]; then
          uv pip install --python "$RUNNER_TEMP/impl-env/bin/python" --require-hashes --only-binary=:all: -r "$deps"
        fi
        (cd board/node && npm ci --no-audit --no-fund)
    - name: Score
      working-directory: atlas
      env:
        BOARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        mkdir -p "$RUNNER_TEMP/out"
        python3 tools/run_board.py --id "${{ matrix.id }}" --slot "${{ matrix.slot }}" --src "$RUNNER_TEMP/impl" \
          --out "$RUNNER_TEMP/out/${{ matrix.id }}-${{ matrix.slot }}.json" \
          --harness "$RUNNER_TEMP/harness/bin/agent-evidence-vectors" --harness-python "$RUNNER_TEMP/harness/bin/python" \
          --python "$RUNNER_TEMP/impl-env/bin/python" --node-runner "$GITHUB_WORKSPACE/atlas/board/node/node_modules/.bin/tsx" \
          --vectors-src "$RUNNER_TEMP/vectors"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
