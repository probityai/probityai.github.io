      run: |
        python3 - <<'PY'
        import json, os
        bad = {k: v['result'] for k, v in json.loads(os.environ['RESULTS']).items()
               if v['result'] not in ('success', 'skipped')}
        print('jobs that did not pass:', bad or 'none')
        raise SystemExit(1 if bad else 0)
        PY
