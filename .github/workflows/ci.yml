# One workflow for every pull-request check. Generated by scripts/fold-workflows.py
# from the workflows it replaced; the changes job selects each group by the paths
# it declared, its cron, or the event. Branch protection requires only ci-ok.
name: ci
'on':
  pull_request:
  merge_group:
  push:
    branches:
    - main
  schedule:
  - cron: 17 5 * * 1
  - cron: 17 6 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: select
      env:
        EVENT: ${{ github.event_name }}
        CRON: ${{ github.event.schedule }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        GROUPS: '{"atlas": {"crons": ["17 6 * * 1"], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas.yml"]}}, "atlas_a2a_card_walk": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-a2a-card-walk.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-a2a-card-walk.yml"]}}, "atlas_agent_errata_watch": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/interop/agent-errata-watch/**", ".github/workflows/atlas-agent-errata-watch.yml"]}, "push": {"ignore": [], "paths": ["atlas/interop/agent-errata-watch/**", ".github/workflows/atlas-agent-errata-watch.yml"]}}, "atlas_ap1_declared_constants": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-ap1-declared-constants.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-ap1-declared-constants.yml"]}}, "atlas_approved_sql": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-approved-sql.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-approved-sql.yml"]}}, "atlas_aps_priorseal_replay": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/experiments/aps-priorseal-source-replay/**", ".github/workflows/atlas-aps-priorseal-replay.yml"]}, "push": {"ignore": [], "paths": ["atlas/experiments/aps-priorseal-source-replay/**", ".github/workflows/atlas-aps-priorseal-replay.yml"]}}, "atlas_board": {"crons": ["17 5 * * 1"], "pull_request": {"ignore": [], "paths": ["atlas/data/board.toml", "atlas/board/**", "atlas/tools/run_board.py", "atlas/tools/gen_board.py", ".github/workflows/atlas-board.yml"]}, "push": null}, "atlas_discovery_capture": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-discovery-capture.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-discovery-capture.yml"]}}, "atlas_discovery_evaluation": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-discovery-evaluation.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-discovery-evaluation.yml"]}}, "atlas_e030_corrected_wrapper": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-e030-corrected-wrapper.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-e030-corrected-wrapper.yml"]}}, "atlas_motebit_approval_triad": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/examples/motebit-approval-triad/**", ".github/workflows/atlas-motebit-approval-triad.yml"]}, "push": {"ignore": [], "paths": ["atlas/examples/motebit-approval-triad/**", ".github/workflows/atlas-motebit-approval-triad.yml"]}}, "atlas_nenrin_tsunagi_referee": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-nenrin-tsunagi-referee.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-nenrin-tsunagi-referee.yml"]}}, "atlas_nenrin_witness_pair": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-nenrin-witness-pair.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-nenrin-witness-pair.yml"]}}, "atlas_provael_task_controls": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-provael-task-controls.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-provael-task-controls.yml"]}}, "atlas_request_effect_join": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-request-effect-join.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-request-effect-join.yml"]}}, "atlas_signed_action_presence": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-signed-action-presence.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-signed-action-presence.yml"]}},
          "atlas_task_grouped_rates": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-task-grouped-rates.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-task-grouped-rates.yml"]}}, "atlas_trace_m1_consumer": {"crons": [], "pull_request": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-trace-m1-consumer.yml"]}, "push": {"ignore": [], "paths": ["atlas/**", ".github/workflows/atlas-trace-m1-consumer.yml"]}}, "figures": {"crons": [], "pull_request": {"ignore": [], "paths": ["figures/**", ".github/workflows/figures.yml"]}, "push": {"ignore": [], "paths": ["figures/**", ".github/workflows/figures.yml"]}}, "site_check": {"crons": [], "pull_request": {"ignore": [], "paths": []}, "push": {"ignore": [], "paths": []}}}'
        INFRA: '[".github/"]'
      run: |
        python3 - <<'PY'
        import json, os, re, subprocess

        def rx(glob):
            out, i = "", 0
            while i < len(glob):
                if glob.startswith("**/", i): out += "(?:.*/)?"; i += 3
                elif glob.startswith("**", i): out += ".*"; i += 2
                elif glob[i] == "*": out += "[^/]*"; i += 1
                elif glob[i] == "?": out += "[^/]"; i += 1
                else: out += re.escape(glob[i]); i += 1
            return re.compile("^" + out + "$")

        def hit(pats, f):
            ok = False
            for p in pats:
                neg = p.startswith("!")
                if rx(p[1:] if neg else p).match(f): ok = not neg
            return ok

        def chosen(paths, ignore, files):
            if paths: return any(hit(paths, f) for f in files)
            if ignore: return any(not hit(ignore, f) for f in files)
            return True

        groups = json.loads(os.environ["GROUPS"]); infra = tuple(json.loads(os.environ["INFRA"]))
        event = os.environ["EVENT"]; run = {}
        if event in ("pull_request", "push"):
            base = os.environ["BASE"]
            if event == "push" and (not base or set(base) == {"0"}):
                files = None
            else:
                proc = subprocess.run(["git", "diff", "--name-only", base, os.environ["HEAD"]],
                                      capture_output=True, text=True)
                files = proc.stdout.split() if proc.returncode == 0 else None
            wide = files is None or any(f.startswith(infra) for f in files)
            for k, g in groups.items():
                t = g[event]
                if t is None: run[k] = False
                elif wide: run[k] = True
                else: run[k] = chosen(t["paths"], t["ignore"], files)
            print("changed files:", "unknown, selecting all" if files is None else len(files), "wide:", wide)
        elif event == "schedule":
            for k, g in groups.items(): run[k] = os.environ["CRON"] in g["crons"]
        else:
            for k, g in groups.items(): run[k] = True
        print(json.dumps(run, indent=1))
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh: fh.write("run=" + json.dumps(run) + "\n")
        PY
  atlas_a2a_card_walk:
    name: a2a-card-walk / retained-walk-rechecks-offline
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_a2a_card_walk }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: atlas/interop/a2a-card-walk
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      with:
        version: 0.12.24
    - name: Install the hash-pinned walk dependencies
      run: |
        uv venv --python 3.14.7 .venv
        uv pip install --python .venv/bin/python --require-hashes --only-binary=:all: -r requirements.txt
    - name: Lint and test the walk, tampering controls included
      run: |
        .venv/bin/ruff check --isolated walk.py test_walk.py
        .venv/bin/ruff format --isolated --check walk.py test_walk.py
        .venv/bin/python -m coverage run --source=walk -m pytest -q test_walk.py
        .venv/bin/python -m coverage report --fail-under=80
    - name: Re-check every retained walk offline
      run: |
        for directory in retained/*/; do
          .venv/bin/python walk.py verify "$directory"
        done
  atlas_agent_errata_watch:
    name: Harness Watch pinned row import / watch-import
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_agent_errata_watch }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python }}
    - name: Install pinned build and lint tools
      working-directory: atlas/interop/agent-errata-watch
      run: python -m pip install -r requirements-check.txt
    - name: Fetch and verify saved source pins
      working-directory: atlas/interop/agent-errata-watch
      run: |
        python fetch_sources.py --output .build/upstream
        python fetch_sources.py --verify-source --output .build/verify-source
    - name: Install the two selected readers
      working-directory: atlas/interop/agent-errata-watch
      run: |
        python -m pip install --no-build-isolation --target .build/installation .
        python -m pip install --no-build-isolation --target .build/verify-installation .build/verify-source
    - name: Lint the importer
      working-directory: atlas/interop/agent-errata-watch
      run: python -m ruff check .
    - name: Require finite native controls
      working-directory: atlas/interop/agent-errata-watch
      run: |
        PROBITY_VERIFY_ROOT="$PWD/.build/verify-installation" python test_import.py > .build/unit-tests.txt 2>&1
        cat .build/unit-tests.txt
    - name: Qualify installed API, CLI and Verify bridge
      working-directory: atlas/interop/agent-errata-watch
      run: |
        python qualify.py --input-root .build/upstream \
          --installation .build/installation \
          --verify-installation .build/verify-installation
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: watch-import-${{ matrix.python }}-${{ github.sha }}
        include-hidden-files: true
        retention-days: 90
        path: |
          .github/workflows/atlas-agent-errata-watch.yml
          atlas/interop/agent-errata-watch/watch_import/*.py
          atlas/interop/agent-errata-watch/fetch_sources.py
          atlas/interop/agent-errata-watch/qualify.py
          atlas/interop/agent-errata-watch/test_import.py
          atlas/interop/agent-errata-watch/pyproject.toml
          atlas/interop/agent-errata-watch/requirements-check.txt
          atlas/interop/agent-errata-watch/source-pins.json
          atlas/interop/agent-errata-watch/README.md
          atlas/interop/agent-errata-watch/report.json
          atlas/interop/agent-errata-watch/.build/unit-tests.txt
          atlas/interop/agent-errata-watch/.build/bundle/
          atlas/interop/agent-errata-watch/.build/controls/
  atlas_ap1_declared_constants:
    name: ap1-declared-constants / known-answers-and-pinned-replay
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_ap1_declared_constants }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: atlas/interop/ap1-declared-constants
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - name: Synthetic known answers
      run: python3 -I -m unittest discover -s tests -v
    - name: Replay the pinned ap1-run states
      run: python3 -I replay.py "$RUNNER_TEMP"
    - name: Retained results match a fresh replay
      run: git diff --exit-code -- results.json
  atlas_approved_sql:
    name: approved-sql / supplied-record-controls
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_approved_sql }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      with:
        version: 0.12.24
    - name: Install the locked example tools in their own environment
      working-directory: atlas/examples/approved-sql
      run: uv sync --frozen --group dev --python 3.14.7
    - name: Check the reader and every supplied-record outcome
      working-directory: atlas/examples/approved-sql
      run: .venv/bin/python scripts/qualify.py
    - name: Refuse failing, empty and unrelated test runs
      run: examples/approved-sql/.venv/bin/python -m pytest tests/test_coverage_gate.py --junitxml=examples/approved-sql/gate-results/coverage-gate-tests.xml
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: approved-sql-supplied-record-controls
        path: atlas/examples/approved-sql/gate-results/
  atlas_aps_priorseal_replay:
    name: APS and PriorSeal source replay / source-replay
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_aps_priorseal_replay }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: altrudev/Frequency-Federation-Review
        ref: 4162622af24c94efb843f53aa27940ffd1256ad6
        path: atlas/.build/aps-priorseal-replay/capsule
        sparse-checkout: capsules/aps-priorseal-v0.1
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: altrudev/Frequency-Federation-Review
        ref: b12879d5878991d9c3ed260d06ee11716eb99d33
        path: atlas/.build/aps-priorseal-replay/review-wrapper
        sparse-checkout: capsules/aps-priorseal-v0.1
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: aeoess/agent-passport-system
        ref: 948f99b85343bef2c6fa677c8543965caacfc087
        path: atlas/.build/aps-priorseal-replay/aps
        sparse-checkout: fixtures/priorseal-decision-binding
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: imokokok/PriorSeal
        ref: d749d2691c3e6be139de4020e7b27cdafca2c428
        path: atlas/.build/aps-priorseal-replay/priorseal
        sparse-checkout: examples/aps-priorseal-decision-binding-v1
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '20'
    - name: Install the review adapter's locked dependencies
      working-directory: atlas/.build/aps-priorseal-replay/capsule/capsules/aps-priorseal-v0.1/adapter
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Check the pinned sources, claims and failed controls
      run: |
        node experiments/aps-priorseal-source-replay/run.mjs \
          --runner https://github.com/probityai/agent-evidence-atlas \
          .build/aps-priorseal-replay/capsule \
          .build/aps-priorseal-replay/aps \
          .build/aps-priorseal-replay/priorseal \
          .build/aps-priorseal-replay/result
    - name: Check the pinned wrapper's run contract
      run: |
        node experiments/aps-priorseal-source-replay/check-run-contract.mjs \
          --runner https://github.com/probityai/agent-evidence-atlas \
          .build/aps-priorseal-replay/review-wrapper \
          .build/aps-priorseal-replay/aps \
          .build/aps-priorseal-replay/priorseal \
          .build/aps-priorseal-replay/contract-result
    - name: Check caller declarations, copied tools and original outcomes
      run: |
        node experiments/aps-priorseal-source-replay/test-runner.mjs \
          .build/aps-priorseal-replay/capsule \
          .build/aps-priorseal-replay/review-wrapper \
          .build/aps-priorseal-replay/aps \
          .build/aps-priorseal-replay/priorseal \
          .build/aps-priorseal-replay/caller-controls
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: aps-priorseal-source-replay
        path: |
          atlas/.build/aps-priorseal-replay/result/receipt.json
          atlas/.build/aps-priorseal-replay/contract-result/record.json
          atlas/.build/aps-priorseal-replay/caller-controls/public-results/
          atlas/.build/aps-priorseal-replay/caller-controls/public-artifact-manifest.json
          atlas/.build/aps-priorseal-replay/result/*.command.json
          atlas/.build/aps-priorseal-replay/result/*.stdout
          atlas/.build/aps-priorseal-replay/result/*.stderr
          atlas/.build/aps-priorseal-replay/contract-result/*.command.json
          atlas/.build/aps-priorseal-replay/contract-result/*.stdout
          atlas/.build/aps-priorseal-replay/contract-result/*.stderr
        if-no-files-found: error
        include-hidden-files: true
  atlas_board__plan:
    name: atlas-board / plan
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_board }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - id: plan
      working-directory: atlas
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json, subprocess, tomllib
        board = tomllib.load(open("data/board.toml", "rb"))
        rows = []
        for item in board["implementation"]:
            if item["status"] != "scored":
                continue
            rows.append({"id": item["id"], "repo": item["repo"], "slot": "pinned", "ref": item["pin"]})
            head = subprocess.run(["git", "ls-remote", f"https://github.com/{item['repo']}", "HEAD"],
                                  capture_output=True, text=True, check=True).stdout.split()[0]
            rows.append({"id": item["id"], "repo": item["repo"], "slot": "head", "ref": head})
        print("matrix=" + json.dumps({"include": rows}))
        PY
  atlas_board__score:
    name: atlas-board / score
    needs:
    - changes
    - atlas_board__plan
    if: ${{ fromJSON(needs.changes.outputs.run).atlas_board && success() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.atlas_board__plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - name: Check out the implementation at its ref, with its tags
      run: |
        git clone --quiet "https://github.com/${{ matrix.repo }}" "$RUNNER_TEMP/impl"
        git -C "$RUNNER_TEMP/impl" -c advice.detachedHead=false checkout --quiet "${{ matrix.ref }}"
    - name: Check out the corpus repository at the release tag
      run: |
        expected=$(python3 -c "import tomllib;print(tomllib.load(open('atlas/data/board.toml','rb'))['meta']['vectors_tag_commit'])")
        git clone --quiet --depth 1 --branch "$(python3 -c "import tomllib;print(tomllib.load(open('atlas/data/board.toml','rb'))['meta']['vectors_tag'])")" \
          https://github.com/probityai/agent-evidence-vectors "$RUNNER_TEMP/vectors"
        test "$(git -C "$RUNNER_TEMP/vectors" rev-parse HEAD)" = "$expected"
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      with:
        version: 0.12.24
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.14.0
    - name: Install the hash-locked harness, the runner and the implementation's dependencies
      working-directory: atlas
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/harness"
