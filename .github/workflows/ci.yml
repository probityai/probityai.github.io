  atlas__build:
    name: atlas / build
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Restore the experiment archives from their release
      working-directory: atlas
      run: python3 tools/archives.py fetch
    - name: Refuse an experiment archive tracked in git or missing from the manifest
      working-directory: atlas
      run: python3 tools/archives.py check
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Install pandoc 3.3
      run: |
        curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.3/pandoc-3.3-1-amd64.deb
        echo "7a6625d5aeb6b8666375807a3e16cc00659c48fb88299707651f60d88c31a360  pandoc.deb" | sha256sum -c -
        sudo dpkg -i pandoc.deb
        pandoc --version | head -1
    - name: Check the atlas page against its data
      run: |
        if [ -f src/atlas.md ]; then python3 tools/gen_atlas.py --check; else echo "no atlas page in this tree"; fi
    - name: Install catalog checks
      run: python3 -m pip install -r requirements/discoverability-test.txt
    - name: Check project identities and generated navigation
      run: python3 -m pytest -q tools/discoverability/test_catalog.py tests/test_discovery.py tests/test_markdown_mirrors.py tests/test_run_browser.py tests/test_link_manual_hosts.py tests/test_corpus_census.py tests/test_release_freshness.py
    - name: Check docs/ against its sources
      run: python3 tools/build.py --check
    - name: Check preview metadata and escaped attributes
      run: python3 -m pytest -q tests/test_social_metadata.py
    - name: Check internal links and anchors
      run: python3 tools/check_links.py
    - name: the README stays one screen and every link in it resolves
      run: |
        python3 scripts/readme-lint.py README.md
        python3 scripts/readme-lint-test.py
    - name: Install public layout checks
      run: |
        python3 -m pip install -r requirements/public-layout.txt
        python3 -m playwright install --with-deps chromium
    - name: Check mobile pages and keyboard controls
      env:
        ATLAS_LAYOUT_EVIDENCE: public-layout-evidence
      run: python3 -m pytest -q tests/test_public_layout.py tests/test_run_browser_layout.py tests/test_evidence_article_layout.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: public-layout
        path: atlas/public-layout-evidence/
  atlas__observer-admission:
    name: atlas / observer-admission
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run).atlas }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: atlas
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
