name: Publish the Atlas

# The Agent Evidence Atlas is built in probityai/agent-evidence-vectors under site/ and served here at
# https://probityai.github.io/agent-evidence-atlas/. This workflow lays agent-evidence-vectors main's
# site/docs over this repository's main and publishes the result to the pages-live branch, which
# GitHub Pages serves. main is the source of the root site and is never written by the workflow:
# its ruleset declines pushes from the workflow token even when the required check has passed on
# the commit, and the organisation does not let Actions open pull requests or use deploy keys.
#
# It pulls, because a push from agent-evidence-vectors would need a stored personal token. The schedule
# bounds the delay at about fifteen minutes after a merge; a push to main also runs it, and it can be
# run by hand from the Actions tab. A run whose result matches pages-live stops after the comparison.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-atlas
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'probityai/probityai.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/agent-evidence-vectors
          ref: main
          path: source
          persist-credentials: false
          sparse-checkout: site
      - name: Compare the combined site with pages-live
        id: diff
        run: |
          set -euo pipefail
          rsync -rc --delete source/site/docs/ pages/agent-evidence-atlas/
          cd pages
          git add -A
          want_tree="$(git write-tree)"
          have_tree=""
          if git fetch --depth 1 origin pages-live; then
            have_tree="$(git rev-parse FETCH_HEAD^{tree})"
          fi
          echo "combined tree ${want_tree}, pages-live tree ${have_tree:-none}"
          if [ "${want_tree}" = "${have_tree}" ]; then
            echo "changes=0" >> "$GITHUB_OUTPUT"
          else
            echo "changes=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.diff.outputs.changes != '0'
        with:
          python-version: "3.12"
      - name: Install pandoc 3.3
        if: steps.diff.outputs.changes != '0'
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.3/pandoc-3.3-1-amd64.deb
          echo "7a6625d5aeb6b8666375807a3e16cc00659c48fb88299707651f60d88c31a360  pandoc.deb" | sha256sum -c -
          sudo dpkg -i pandoc.deb
      - name: Require docs/ to match its sources
        if: steps.diff.outputs.changes != '0'
        working-directory: source/site
        run: |
          python3 -m pip install -r requirements/discoverability-test.txt
          python3 tools/build.py --check
      - name: Commit and publish to pages-live
        if: steps.diff.outputs.changes != '0'
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish the Atlas from agent-evidence-vectors ${sha}"
          git push --force origin HEAD:refs/heads/pages-live
          echo "published=${sha}" >> "$GITHUB_ENV"
      - name: Read the served register back
        if: steps.diff.outputs.changes != '0'
        run: |
          set -euo pipefail
          want="$(sha256sum source/site/docs/lab/register.json | cut -d' ' -f1)"
          for _ in $(seq 1 45); do
            got="$(curl -fsSL "https://probityai.github.io/agent-evidence-atlas/lab/register.json?sync=${published}" | sha256sum | cut -d' ' -f1 || true)"
            if [ "${got}" = "${want}" ]; then
              echo "served lab/register.json matches ${published} (${want})"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the served lab/register.json is ${got}, expected ${want}"
          exit 1
