name: Publish the Atlas and the identifier pages

# The Agent Evidence Atlas is built in this repository under atlas/ and served at
# https://probityai.github.io/agent-evidence-atlas/ from atlas/docs. Its experiment archives are
# assets of the release that atlas/ARCHIVES.json names, restored and digest-checked before publish.
# The pages behind the persistent identifiers under https://w3id.org/agent-evidence/ are built in
# probityai/agent-evidence-vectors under pages/ and served here at
# https://probityai.github.io/agent-evidence/. This workflow lays atlas/docs and that pages/ over
# this repository's main, drops the atlas/ source from the published tree, and publishes the result
# to the pages-live branch, which GitHub Pages serves. main is never written by the workflow: its
# ruleset declines pushes from the workflow token, and the organisation does not let Actions open
# pull requests or use deploy keys.
#
# It pulls pages/, because a push from agent-evidence-vectors would need a stored personal token.
# The schedule bounds the delay at about fifteen minutes after a merge there; a push to main here
# also runs it, and it can be run by hand from the Actions tab. A run whose result matches
# pages-live stops after the comparison. After a publish, scripts/check_served.py requires every
# published file and every w3id identifier to answer 200 with the published bytes,
# after the Pages build for the pushed commit reports built (the build races the check otherwise).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  actions: read

# GitHub's own "pages-build-deployment" run deploys pages-live after each push, and it refuses a deploy
# while another is in progress (runs 41289027907 and 41290076112, 1 Nov 2026). That run cannot take a
# concurrency group, so this job, the only writer of pages-live, waits until no Pages deploy is queued
# or running before it pushes (and for its own build after, in the served check): with the group below,
# no two deploys overlap.

concurrency:
  group: sync-atlas
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'probityai/probityai.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/agent-evidence-vectors
          ref: main
          path: source
          persist-credentials: false
          sparse-checkout: |
            pages
            scripts/check_predicate_pages.py
      - name: Restore the experiment archives from their release
        working-directory: pages/atlas
        run: python3 tools/archives.py fetch
      - name: Compare the combined site with pages-live
        id: diff
        run: |
          set -euo pipefail
          rsync -rc --delete pages/atlas/docs/ pages/agent-evidence-atlas/
          rsync -rc --delete source/pages/ pages/agent-evidence/
          # The source tree is checked from its own copy; only its built docs/ are served.
          rsync -a pages/atlas/ atlas-src/
          rm -rf pages/atlas
          cd pages
          git add -A
          want_tree="$(git write-tree)"
          have_tree=""
          if git fetch --depth 1 origin pages-live; then
            have_tree="$(git rev-parse "FETCH_HEAD^{tree}")"
          fi
          echo "combined tree ${want_tree}, pages-live tree ${have_tree:-none}"
          if [ "${want_tree}" = "${have_tree}" ]; then
            echo "changes=0" >> "$GITHUB_OUTPUT"
          else
            echo "changes=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.diff.outputs.changes != '0'
        with:
          python-version: "3.12"
      - name: Install pandoc 3.3
        if: steps.diff.outputs.changes != '0'
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.3/pandoc-3.3-1-amd64.deb
          echo "7a6625d5aeb6b8666375807a3e16cc00659c48fb88299707651f60d88c31a360  pandoc.deb" | sha256sum -c -
          sudo dpkg -i pandoc.deb
      - name: Require docs/ to match its sources
        if: steps.diff.outputs.changes != '0'
        working-directory: atlas-src
        run: |
          python3 -m pip install -r requirements/discoverability-test.txt
          python3 tools/build.py --check
      - name: Require every predicate page to match its pin
        if: steps.diff.outputs.changes != '0'
        run: python3 source/scripts/check_predicate_pages.py
      - name: Wait for any Pages deploy in flight
        if: steps.diff.outputs.changes != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pages/scripts/check_served.py --wait-idle --repo "$GITHUB_REPOSITORY"
      - name: Commit and publish to pages-live
        if: steps.diff.outputs.changes != '0'
        run: |
          set -euo pipefail
          sha="$(git -C pages rev-parse HEAD) and agent-evidence-vectors $(git -C source rev-parse HEAD)"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish the Atlas and the identifier pages from ${sha}"
          git push --force origin HEAD:refs/heads/pages-live
          echo "published=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read the served register back
        if: steps.diff.outputs.changes != '0'
        run: |
          set -euo pipefail
          want="$(sha256sum atlas-src/docs/lab/register.json | cut -d' ' -f1)"
          for _ in $(seq 1 45); do
            got="$(curl -fsSL "https://probityai.github.io/agent-evidence-atlas/lab/register.json?sync=${published}" | sha256sum | cut -d' ' -f1 || true)"
            if [ "${got}" = "${want}" ]; then
              echo "served lab/register.json matches ${published} (${want})"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the served lab/register.json is ${got}, expected ${want}"
          exit 1
      - name: Read the served identifier page back
        if: steps.diff.outputs.changes != '0'
        run: |
          set -euo pipefail
          want="$(sha256sum source/pages/predicate/v1/PAGES.sha256 | cut -d' ' -f1)"
          for _ in $(seq 1 45); do
            got="$(curl -fsSL "https://probityai.github.io/agent-evidence/predicate/v1/PAGES.sha256?sync=${published}" | sha256sum | cut -d' ' -f1 || true)"
            if [ "${got}" = "${want}" ]; then
              echo "served agent-evidence/predicate/v1/PAGES.sha256 matches ${published} (${want})"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the served agent-evidence/predicate/v1/PAGES.sha256 is ${got}, expected ${want}"
          exit 1
      - name: Require every published file and w3id identifier to serve its published bytes
        if: steps.diff.outputs.changes != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pages/scripts/check_served.py --tree pages --sync "${published}" --repo "${{ github.repository }}"
