# Runs the Atlas checks from atlas/ (moved from agent-evidence-vectors atlas/ on 2026-10-31).
name: ap1-declared-constants

on:
  push:
    paths: ['atlas/**', '.github/workflows/atlas-ap1-declared-constants.yml']
    branches: [main]
  pull_request:
    paths: ['atlas/**', '.github/workflows/atlas-ap1-declared-constants.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: atlas

jobs:
  known-answers-and-pinned-replay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: atlas/interop/ap1-declared-constants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the experiment archives from their release
        working-directory: atlas
        run: python3 tools/archives.py fetch
      - name: Synthetic known answers
        run: python3 -I -m unittest discover -s tests -v
      - name: Replay the pinned ap1-run states
        run: python3 -I replay.py "$RUNNER_TEMP"
      - name: Retained results match a fresh replay
        run: git diff --exit-code -- results.json
