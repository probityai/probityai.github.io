# The one token set for every public figure of the probityai org and for the site's CSS.
# Ruling: probity research/1132 RULING.md sections 4-6. Primer neutrals plus the Okabe-Ito meaning inks,
# lightness re-inked per theme; every text and mark pair is checked by figures/check.py on the card and tile.
# There is no muted text tier in dark: hierarchy comes from face and weight.

[light]
card    = "#f6f8fa"   # the opaque card every figure sits on
tile    = "#ffffff"   # tiles and file sheets inside the card
fg      = "#1f2328"   # text, verdict words and glyphs
muted   = "#59636e"   # secondary text, weight 500 only
rule    = "#858e98"   # outlines, the log reader's dotted route
byte    = "#6e7781"   # a byte cell at rest
accent  = "#156d9e"   # the verifier and its route
loss    = "#a94b00"   # a changed, missing or refused element (marks only)
self    = "#007555"   # the producer's own view of itself (marks only)

[dark]
card    = "#151b23"
tile    = "#0d1117"
fg      = "#e6edf3"
muted   = "#e6edf3"
rule    = "#7d8590"
byte    = "#8b949e"
accent  = "#56b4e9"
loss    = "#f1772e"
self    = "#2fbf8f"

[type]
# One size per layout. Wide figures are 1280 units and render at about 830 px on a GitHub README column
# (26 x 830/1280 = 16.9 px); narrow are 720 units and are placed at 420 px or less (34 x 420/720 = 19.8 px,
# 34 x 343/720 = 16.2 px on a phone column).
wide_width = 1280
narrow_width = 720
text_wide = 26
text_narrow = 34
