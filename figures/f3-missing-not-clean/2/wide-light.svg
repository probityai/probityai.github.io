<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d"><title id="t">A passage missing from the record is not a clean record</title><desc id="d">A record of seven passages with one missing. A reader that trusts the record reads what it holds, jumps over the gap without reading it and says fine. probity-verify reads the record against the source capture, halts at the gap and returns contradicted: this passage is missing from the record, reason selected_span_missing_from_record. The two verdicts sit in one column.</desc><style>@font-face{font-family:fk-mono;font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:fk-sans;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:fk-sans;font-weight:600;src:url(data:font/woff;base64,) format('woff')}</style><rect x="0" y="0" width="1280" height="360" rx="6" fill="#f6f8fa"/><rect x="122.5" y="124" width="580" height="94" rx="8" stroke-width="2" fill="none" stroke="#858e98"/><text x="24" y="180.1" font-family="fk-sans, IBM Plex Sans, Inter, sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#59636e">record</text><path d="M132.5 134.0 L188.5 134.0 L200.5 146.0 L200.5 208.0 L132.5 208.0 Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff" stroke="#858e98"/><path d="M188.5 134.0 L188.5 146.0 L200.5 146.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#858e98"/><rect x="143.5" y="151" width="12" height="12" rx="2" fill="#6e7781"/><rect x="160.5" y="151" width="12" height="12" rx="2" fill="#6e7781"/><rect x="177.5" y="151" width="12" height="12" rx="2" fill="#6e7781"/><rect x="143.5" y="168" width="12" height="12" rx="2" fill="#6e7781"/><rect x="160.5" y="168" width="12" height="12" rx="2" fill="#6e7781"/><rect x="177.5" y="168" width="12" height="12" rx="2" fill="#6e7781"/><rect x="143.5" y="185" width="12" height="12"