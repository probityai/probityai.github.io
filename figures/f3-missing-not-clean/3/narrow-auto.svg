<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 443" width="720" height="443" role="img" aria-labelledby="t d"><title id="t">A passage missing from the record is not a clean record</title><desc id="d">Top: a record of seven passages with the fifth missing. A reader that trusts the record looks only at the record, passes the gap and says fine. Bottom: the source capture, all seven passages. probity-verify pairs each source passage with its passage in the record, finds the fifth has none, and returns contradicted, reason selected_span_missing_from_record. The two verdicts sit in one column.</desc><style>@font-face{font-family:fk-mono;font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:fk-sans;font-weight:600;src:url(data:font/woff;base64,) format('woff')}@media (prefers-color-scheme:dark){.f-byte{fill:#8b949e}.f-card{fill:#151b23}.f-fg{fill:#e6edf3}.f-muted{fill:#e6edf3}.f-tile{fill:#0d1117}.s-absent{stroke:#d685c0}.s-accent{stroke:#56b4e9}.s-fg{stroke:#e6edf3}.s-loss{stroke:#f1772e}.s-rule{stroke:#7d8590}}</style><rect x="0" y="0" width="720" height="443" rx="12" fill="#f6f8fa" class="f-card"/><rect x="98" y="90" width="262" height="84" rx="8" stroke-width="2.5" fill="none" stroke="#858e98" class="s-rule"/><rect x="98" y="244" width="262" height="84" rx="8" stroke-width="2.5" fill="none" stroke="#858e98" class="s-rule"/><path d="M108.0 254.0 L122.0 254.0 L134.0 266.0 L134.0 318.0 L108.0 318.0 Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff" stroke="#858e98" class="f-tile s-rule"/><path d="M122.0 254.0 L122.0 266.0 L134.0 266.0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#858e98" class="s-rule"/><rect x="115" y="267" width="12" height="12" rx="2" fill="#6e7781" class="f-byte"/><rect x="115" y="283" width="12" height="12" rx="2" fill="#6e7781" class="f-byte"/><rect x="115" y="299" width="12" height="12" rx="2" fill="#6e7781" class="f-byte"/><path d="M108